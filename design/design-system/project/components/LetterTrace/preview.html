<!doctype html>
<html>
<head><meta charset="utf-8"><title>LetterTrace — preview</title></head>
<body style="margin:0">
<div id="root" style="padding:20px;display:grid;gap:16px;background:var(--paper)"></div>
<script>
  var F = window.FollowMeTherapy, h = React.createElement;
  function Row(p) { return h('div', { className: 'fmt-letters' }, h(F.LetterTrace, { letter: p.l }), h(F.LetterTrace, { letter: p.l, mode: 'trace' }), h(F.LetterTrace, { letter: p.l, mode: 'trace' })); }

</script>
</body>
</html>
