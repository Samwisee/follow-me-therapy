<!-- @dsCard group="Content" height=300 subtitle="Concentric corners: outer radius = inner radius + gap" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Nest — preview</title></head>
<body style="margin:0">
<div style="padding:28px;display:flex;gap:32px;align-items:flex-start;flex-wrap:wrap;background:var(--teal-tint);font-family:var(--font-body)">
  <div class="fmt-nest" style="--nest-gap:24px;--nest-inner:var(--radius-md);background:var(--paper);width:260px;box-shadow:var(--shadow-soft)">
    <div style="height:150px;background:var(--teal-tint)"></div>
    <p style="margin:12px 0 0;font-weight:600;color:var(--ink);border-radius:0">Photo 16 + gap 24 = card 40</p>
  </div>
  <div class="fmt-nest" style="--nest-gap:8px;--nest-inner:22px;--nest-border:2px;background:var(--paper);border:2px solid var(--purple-line);width:200px;display:grid;gap:4px">
    <span style="display:flex;align-items:center;height:44px;padding:0 20px;font-family:var(--font-display);font-weight:500;color:var(--ink)">Services</span>
    <span style="display:flex;align-items:center;height:44px;padding:0 20px;background:var(--purple);color:var(--paper);font-family:var(--font-display);font-weight:500">Funding</span>
    <span style="display:flex;align-items:center;height:44px;padding:0 20px;font-family:var(--font-display);font-weight:500;color:var(--ink)">Telehealth</span>
  </div>
</div>
</body>
</html>
