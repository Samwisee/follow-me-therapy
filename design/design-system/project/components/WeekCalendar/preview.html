<!-- @dsCard group="App" height=360 subtitle="Compact: the practice week's stars: not planned (dot), planned, partly done, done; tap a practice star to add it" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>WeekCalendar — preview</title></head>
<body style="margin:0">
<div id="root" style="padding:20px;max-width:420px;background:var(--paper)"></div>
<script>
  var F = window.FollowMeTherapy, h = React.createElement;
  function Week() {
    var s = React.useState(['done', 'none', 'done', 'none', 'planned', 'none', 'none']);
    var practice = { label: 'Cutting practice · 4pm', href: '#cutting', tone: 'sun', days: s[0], onToggle: function (i) { var d = s[0].slice(); d[i] = d[i] === 'done' ? 'planned' : 'done'; s[1](d); } };
    return h(F.WeekCalendar, { dates: [26, 27, 28, 29, 30, 31, 1], today: 4, rows: [
      { label: 'Morning routine · 7:30am', href: '#morning', days: ['done', 'done', 'partial', 'done', 'partial', 'planned', 'planned'] },
      { label: 'Calm-down plan · when needed', tone: 'teal', days: ['none', 'done', 'none', 'none', 'none', 'none', 'none'] },
      practice ] });
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Week));
</script>
</body>
</html>
