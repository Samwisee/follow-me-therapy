<!doctype html>
<html>
<head><meta charset="utf-8"><title>WeekCalendar — preview</title></head>
<body style="margin:0">
<div id="root" style="padding:20px;max-width:420px;background:var(--paper)"></div>
<script>
  var F = window.FollowMeTherapy, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(F.WeekCalendar, { dates: [26, 27, 28, 29, 30, 31, 1], today: 4, rows: [
    { label: 'Morning routine', days: ['done', 'done', 'partial', 'done', 'partial', 'planned', 'planned'] },
    { label: 'Calm-down plan', tone: 'teal', days: ['none', 'done', 'none', 'none', 'none', 'none', 'none'] },
    { label: 'Cutting practice', tone: 'sun', days: ['done', 'none', 'done', 'none', 'planned', 'none', 'none'] } ] }));
</script>
</body>
</html>
