<!-- @dsCard height=288 -->
<style>
  .cv { position: relative; width: 960px; height: 288px; background: var(--paper); overflow: hidden; }
  .cv svg { position: absolute; inset: 0; }
  .purple { fill: var(--purple); } .teal { fill: var(--teal); } .sun { fill: var(--sun); }
  .deep { fill: var(--deep); } .tint { fill: var(--purple-tint); } .step { fill: var(--paper); }
  .cv-text { position: absolute; left: 40px; bottom: 36px; max-width: 440px; }
  .cv-name { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 80px; line-height: .95; letter-spacing: -0.01em; color: var(--ink); }
  .cv-tag { margin: 14px 0 0; font-family: var(--font-body); font-weight: 600; font-size: 14px; color: var(--ink-soft); }
</style>
<div class="cv">
  <svg viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
    <!--
      blocks: purple slab 168×236 (radius-frame 28), teal pill 280×88 (radius-pill), sun disc r72, deep tile 104×132 (radius-card 24), purple-tint relief 120×96 (radius-card)
      arrangement: one tall slab bleeding off the top with satellites; the pill and the deep tile bleed off the right edge
      pattern: a literal motif, the anatomical footstep trail (left and right prints) ("following" is the practice's name and its idea)
      steps and radii: gaps space-4 (16) and space-6 (24); radius-frame, radius-card, radius-pill; prints 16×24 at roughly space-8 pitch
    -->
    <rect class="tint" x="496" y="196" width="120" height="96" rx="24"/>
    <rect class="purple" x="520" y="-28" width="168" height="236" rx="28"/>
    <circle class="sun" cx="784" cy="84" r="72"/>
    <rect class="deep" x="872" y="-24" width="104" height="132" rx="24"/>
    <rect class="teal" x="704" y="176" width="280" height="88" rx="44"/>
    <defs><g id="foot"><path d="M7.6 6.6C11.2 6.2 13.9 7.8 13.6 10.8 13.4 12.8 11.4 14 10.9 16.2 10.5 18 11.6 19.4 11.2 21.2 10.8 23.2 9.3 24 7.7 24 5.6 24 4.3 22.7 4.3 20.6 4.3 17.6 3 15.8 2.8 12.8 2.5 9.2 4.4 6.9 7.6 6.6Z"/><ellipse cx="11.5" cy="3.1" rx="2.05" ry="2.55"/><circle cx="8.15" cy="2.25" r="1.35"/><circle cx="5.85" cy="2.9" r="1.2"/><circle cx="3.95" cy="4.15" r="1.05"/><circle cx="2.55" cy="5.85" r="0.9"/></g></defs>
    <g class="step">
      <use href="#foot" transform="translate(564 52) rotate(140)  scale(1.35) translate(-8 -12)"/>
      <use href="#foot" transform="translate(600 84) rotate(140) scale(-1 1) scale(1.35) translate(-8 -12)"/>
      <use href="#foot" transform="translate(616 124) rotate(140)  scale(1.35) translate(-8 -12)"/>
      <use href="#foot" transform="translate(652 152) rotate(140) scale(-1 1) scale(1.35) translate(-8 -12)"/>
      <use href="#foot" transform="translate(744 196) rotate(90)  scale(1.35) translate(-8 -12)"/>
      <use href="#foot" transform="translate(784 224) rotate(90) scale(-1 1) scale(1.35) translate(-8 -12)"/>
      <use href="#foot" transform="translate(828 194) rotate(90)  scale(1.35) translate(-8 -12)"/>
      <use href="#foot" transform="translate(868 222) rotate(90) scale(-1 1) scale(1.35) translate(-8 -12)"/>
    </g>
  </svg>
  <div class="cv-text">
    <h1 class="cv-name">Follow Me Therapy</h1>
    <p class="cv-tag">Paediatric OT, on screen and on paper.</p>
  </div>
</div>
