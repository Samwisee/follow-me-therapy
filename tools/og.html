<!doctype html>
<!--
  The link-preview (share) image: 1200 × 630, rendered by tools/make_og.py.
  It's built from the website's own stylesheets and markup (the tokens, the
  practice name at weight-brand, the hero chips, Simone's photo frame), so a
  design change on the site changes this image the next time it's rendered.
  Only the layout of the card itself lives here.
-->
<html lang="en" class="js fonts-ready">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../css/tokens.css" />
<link rel="stylesheet" href="../css/site.css" />
<link rel="stylesheet" href="../css/home.css" />
<style>
  html, body { width: 1200px; height: 630px; overflow: hidden; scrollbar-gutter: auto; }
  body {
    display: grid;
    grid-template-columns: 700px 1fr;
    background: var(--purple-tint);
    position: relative;
  }
  /* The same soft shapes as the home hero. */
  body::before, body::after { content: ""; position: absolute; border-radius: 50%; }
  body::before { width: calc(var(--space-30) * 2.6); aspect-ratio: 1; left: calc(-1 * var(--space-30)); top: calc(-1 * var(--space-30)); background: var(--sun-soft); opacity: 0.6; }
  body::after { width: calc(var(--space-30) * 1.8); aspect-ratio: 1; right: calc(-1 * var(--space-16)); bottom: calc(-1 * var(--space-16)); background: var(--mint); opacity: 0.7; }
  .words {
    position: relative; z-index: var(--z-base);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding-left: var(--space-12);
    text-align: center;
  }
  /* The practice name and logo, exactly as in the hero, at a fixed size. */
  .words .title-container {
    --nav-inset: 0px;
    width: auto; margin: 0; padding: 0;
    flex-direction: column; gap: var(--space-2);
    font-size: 64px;
    animation: none; opacity: 1;
  }
  .words .site-title { white-space: nowrap; }
  .words .eyebrow { margin: var(--space-4) 0 var(--space-7); }
  .words .facts { flex-direction: column; margin: 0; container-type: normal; font-size: var(--text-xl); }
  .words .facts li { font-size: 21px; }
  .words .facts li svg { width: 26px; height: 26px; }
  .words .facts li.fact-place { flex-direction: row; }
  /* Simone in her frame, nested like the Meet Simone card. */
  .photo { position: relative; z-index: var(--z-base); display: flex; align-items: center; padding: var(--space-10) var(--space-12) var(--space-10) var(--space-4); }
  .photo .bio { display: block; width: 100%; height: 100%; }
  .photo .bio-photo { width: 100%; height: 100%; min-height: 0; max-height: none; aspect-ratio: auto; margin: 0; }
  .photo .bio-photo img { opacity: 1; }
</style>
</head>
<body>
  <div class="words">
    <div class="title-container">
      <img class="logo-image" src="../img/brand/follow-me-therapy-mark.svg" alt="" width="226" height="250" />
      <p class="site-title">Follow Me Therapy</p>
    </div>
    <p class="eyebrow">Paediatric Occupational Therapy</p>
    <ul class="facts">
      <li class="fact-age"><a><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M8.5 14.5c1.8 2 5.2 2 7 0" /><path d="M9 9.8v.1M15 9.8v.1" /></svg>Ages 0–18</a></li>
      <li class="fact-tele"><a><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="3" /><path d="M16 10.5l5-3v9l-5-3" /></svg>Telehealth Australia-wide</a></li>
      <li class="fact-place"><a><span class="fact-main"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z" /><circle cx="12" cy="10" r="2.4" /></svg>Community sessions</span> <span class="fact-more">in North-Western Melbourne</span></a></li>
    </ul>
  </div>
  <div class="photo">
    <div class="bio"><div class="bio-photo"><img src="../img/simone-cutout.webp" alt="" class="loaded" /></div></div>
  </div>
</body>
</html>
